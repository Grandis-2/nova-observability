# 로그 전용 Collector. 트레이스·메트릭 파이프라인은 두지 않는다.
# 앱이 traces/metrics 를 보내면 받지 않는다 — 파이프라인이 없어 receiver 가 그 경로를 열지 않는다(HTTP /v1/traces → 404).
#
# 이 경로는 손실을 허용한다 — 디스크 큐가 없고, 메모리가 차면 memory_limiter 가 받기를 거부한다.
# 정본이 필요한 기록은 이 경로에 기대지 않는다.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # compose 의 mem_limit(768m) 안에서 GC 여유를 남긴다.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 1s

  # 카디널리티 예산. 리소스 속성은 남길 것만 고른다(빼는 방식이 아니라 남기는 방식).
  # 여기를 통과한 리소스 속성은 Loki 에서 인덱스 라벨(loki.yaml 의 index_label)이거나
  # structured metadata 가 된다. 목록에 없는 속성은 저장되지 않는다.
  #
  # process.pid · process.command_args · os.description 은 조회 축이 아니면서 길거나 재시작마다 바뀐다.
  # aws.ecs.* 는 넣지 않았다. aws.ecs.task.arn · cluster.arn 에 계정 ID 가 들어 있고,
  # 태스크를 가리키는 데는 service.instance.id 와 host.name 으로 충분하다.
  transform/resource-allowlist:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, [
              "service.name",
              "service.version",
              "service.namespace",
              "service.instance.id",
              "deployment.environment",
              "deployment.environment.name",
              "k8s.cluster.name",
              "k8s.namespace.name",
              "k8s.pod.name",
              "k8s.deployment.name",
              "host.name"
            ])

  # 저장 전 마스킹. 어느 경로(Grafana · Loki API)로 읽어도 원문이 없게, 저장하기 전에 지운다. 되돌릴 수 없다.
  # 안전망이다 — 1차 방어는 앱이 애초에 남기지 않는 것이다. 결정과 한계는 README "저장 전 마스킹".
  #
  # 대상: 로그 본문(문자열이면 통째로, 맵이면 그 값들)과 로그 레코드 속성의 모든 문자열 값.
  #   exception.message · exception.stacktrace 도 속성이므로 함께 걸린다.
  #   맵 · 목록 속성 안에 중첩된 값은 보지 않는다(replace_all_patterns 는 한 단계만 본다).
  # 리소스 속성은 보지 않는다. 위 허용 목록이 서비스 · 호스트 식별자만 남겨 사용자 값이 들어올 자리가 없다.
  #
  # 패턴(Go RE2 — 앞뒤 보기가 없어 \b 로 경계를 잡는다. \b 는 ASCII 기준이라 한글 옆에서도 경계가 된다)
  #   중복 키: MySQL 의 Duplicate entry '<값>' for key 에서 <값>. 키 이름과 상관없이 건다. 전화 · 이메일보다 먼저 한다.
  #   전화: +82 형식을 먼저, 그다음 01X 국내 형식. 구분자는 - . 공백 또는 없음.
  #     앞뒤가 \b 여야 하므로 더 긴 숫자열 · 16진수열(UUID · trace ID)의 일부는 걸리지 않는다.
  #     13자리 epoch ms · 0 으로 시작하지 않는 숫자 ID 도 걸리지 않는다.
  #   이메일: local@domain.tld. 'Foo@1a2b3c' 같은 객체 toString 은 점 + 영문 TLD 가 없어 걸리지 않는다.
  transform/mask:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(log.body, "(?s)Duplicate entry '.*?' for key", "Duplicate entry '<masked>' for key") where IsString(log.body)
          - replace_pattern(log.body, "\\+82[-. ]?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}\\b", "<masked:phone>") where IsString(log.body)
          - replace_pattern(log.body, "\\b01[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}\\b", "<masked:phone>") where IsString(log.body)
          - replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<masked:email>") where IsString(log.body)
          - replace_all_patterns(log.body, "value", "(?s)Duplicate entry '.*?' for key", "Duplicate entry '<masked>' for key") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "\\+82[-. ]?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}\\b", "<masked:phone>") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "\\b01[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}\\b", "<masked:phone>") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<masked:email>") where IsMap(log.body)
          - replace_all_patterns(log.attributes, "value", "(?s)Duplicate entry '.*?' for key", "Duplicate entry '<masked>' for key")
          - replace_all_patterns(log.attributes, "value", "\\+82[-. ]?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}\\b", "<masked:phone>")
          - replace_all_patterns(log.attributes, "value", "\\b01[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}\\b", "<masked:phone>")
          - replace_all_patterns(log.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<masked:email>")

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/resource-allowlist, transform/mask, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: info
