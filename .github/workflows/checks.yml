name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 범용 디렉터리에 nova 가 없다
        run: ./scripts/check-generic.sh

      - name: compose 설정 해석
        env:
          OBS_DATA_DIR: /tmp/obs
          LOKI_S3_BUCKET: example
          LOKI_S3_REGION: ap-northeast-2
          LOKI_RETENTION_PERIOD: 2160h
          GRAFANA_ADMIN_PASSWORD_FILE: /dev/null
        run: docker compose -f stack/compose.yaml config --quiet

      # transform 문(OTTL)은 Collector 가 띄울 때 해석한다. 문법이 틀리면 Collector 가 뜨지 않으므로 여기서 먼저 본다.
      - name: Collector 설정 해석
        run: |
          image="$(sed -n 's/^ *image: \(otel\/opentelemetry-collector-contrib:.*\)$/\1/p' stack/compose.yaml)"
          test -n "$image"
          docker run --rm -v "$PWD/stack/otel-collector.yaml:/c.yaml:ro" "$image" validate --config=/c.yaml
